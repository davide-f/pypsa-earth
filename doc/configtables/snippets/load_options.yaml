load_options:
  source: "gegis" # "gegis" (scenario-based: 2011, 2013, 2018 available) or "demcast" (hourly 2000–2025 available, 2025 for 91 countries): view [issue #1724](https://github.com/pypsa-meets-earth/pypsa-earth/issues/1724) for more details
  weather_year: 2013 # Weather year of the load profile
  prediction_year: 2030 # Valid only if "gegis" used as a source
  scale: 1 # scales all load time-series, i.e. 2 = doubles load
  interpolate_gaps_duration: 48 # maximum consecutive missing snapshots eligible for repair
  fill_missing:
    fill_long_gaps: true # replace whole profiles with gaps exceeding the repair limit
    base_country: "NG"
    gdp: 1194938546688.0 # reference totals must match administrative data units
    pop: 206119089.90968263
